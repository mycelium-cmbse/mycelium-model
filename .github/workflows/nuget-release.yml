name: Nuget-Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer (e.g., 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Validate version (SemVer)
        id: semver
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\.-]+)?$ ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            if [[ "$VERSION" == *-* ]]; then
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "Provided version '$VERSION' is not SemVer." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack -c Release -o ReleaseBuilds -p:Version=${{ env.VERSION }} Mycelium.Model.csproj

      - name: Commit XMI version stamp to default branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mycelium-forge.xmi

          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${VERSION} (stamp model version in xmi)"
            git push origin HEAD:${DEFAULT_BRANCH}
          else
            echo "No changes to mycelium-forge.xmi."
          fi

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ReleaseBuilds/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create annotated tag at this commit
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create draft GitHub release (attach nupkg)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ env.PRERELEASE }}
          name: "Mycelium.Model ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          body: |
            Mycelium.Model ${{ env.VERSION }}

            See the package's `PackageReleaseNotes` on NuGet.org for details, or the commit history since the previous tag.
          files: |
            ReleaseBuilds/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
