name: Nuget-Release

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Which model to release'
        required: true
        type: choice
        options:
          - forge
          - fabric
          - commonprimitives
      version:
        description: 'SemVer (e.g., 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MODEL: ${{ github.event.inputs.model }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Resolve model project
        run: |
          set -euo pipefail
          case "$MODEL" in
            forge)
              echo "PACKAGE_ID=Mycelium.Model.Forge" >> "$GITHUB_ENV"
              echo "PROJECT_PATH=Mycelium.Model.Forge/Mycelium.Model.Forge.csproj" >> "$GITHUB_ENV"
              echo "XMI_PATH=Mycelium.Model.Forge/mycelium-forge.xmi" >> "$GITHUB_ENV"
              ;;
            fabric)
              echo "PACKAGE_ID=Mycelium.Model.Fabric" >> "$GITHUB_ENV"
              echo "PROJECT_PATH=Mycelium.Model.Fabric/Mycelium.Model.Fabric.csproj" >> "$GITHUB_ENV"
              echo "XMI_PATH=Mycelium.Model.Fabric/mycelium-fabric.xmi" >> "$GITHUB_ENV"
              ;;
            commonprimitives)
              echo "PACKAGE_ID=Mycelium.Model.CommonPrimitives" >> "$GITHUB_ENV"
              echo "PROJECT_PATH=Mycelium.Model.CommonPrimitives/Mycelium.Model.CommonPrimitives.csproj" >> "$GITHUB_ENV"
              echo "XMI_PATH=Mycelium.Model.CommonPrimitives/mycelium-commonprimitives.xmi" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown model '$MODEL'." >&2
              exit 1
              ;;
          esac

      - name: Validate version (SemVer)
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\.-]+)?$ ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            if [[ "$VERSION" == *-* ]]; then
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "Provided version '$VERSION' is not SemVer." >&2
            exit 1
          fi

      - name: Set date
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Update CITATION.cff (version + date)
        run: |
          set -euo pipefail
          # Top-level
          sed -i "s/^version:.*/version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
          # preferred-citation (two-space indent)
          sed -i "s/^  version:.*/  version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^  date-released:.*/  date-released: \"${DATE}\"/" CITATION.cff

      - name: Update <Version> in the released project's .csproj
        run: |
          set -euo pipefail
          # Keeps the csproj's own <Version> in sync with what's actually published, so that any
          # other model's <ProjectReference> to this project (e.g. Forge/Fabric -> CommonPrimitives)
          # resolves the correct nuspec dependency version at pack time — that resolution reads the
          # referenced project's <Version> element on disk, not the -p:Version override below (NuGet
          # strips Version/PackageVersion before evaluating ProjectReference dependency versions).
          sed -i "0,/<Version>.*<\/Version>/s//<Version>${VERSION}<\/Version>/" "${PROJECT_PATH}"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack -c Release -o ReleaseBuilds -p:Version=${{ env.VERSION }} "${{ env.PROJECT_PATH }}"

      - name: Commit version stamps to default branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${XMI_PATH}" "${PROJECT_PATH}" CITATION.cff

          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${PACKAGE_ID} ${VERSION} (stamp model version in xmi and csproj, update CITATION.cff)"
            git push origin HEAD:${DEFAULT_BRANCH}
          else
            echo "No changes to ${XMI_PATH}, ${PROJECT_PATH}, or CITATION.cff."
          fi

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ReleaseBuilds/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create annotated tag at this commit
        run: |
          TAG="${MODEL}/${VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag -a "${TAG}" -m "Release ${PACKAGE_ID} ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Create draft GitHub release (attach nupkg)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          prerelease: ${{ env.PRERELEASE }}
          name: "${{ env.PACKAGE_ID }} ${{ env.VERSION }}"
          tag_name: ${{ env.TAG }}
          body: |
            ${{ env.PACKAGE_ID }} ${{ env.VERSION }}

            See the package's `PackageReleaseNotes` on NuGet.org for details, or the commit history since the previous `${{ env.MODEL }}/*` tag.
          files: |
            ReleaseBuilds/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
